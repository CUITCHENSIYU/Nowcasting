dataset:
  type: SyntheticNowcastDataset
  seq_len: 16
  forecast_steps: 96
  input_size: 256
  num_bins: 512
  bin_size: 0.2
  train:
    length: 256
  val:
    length: 32

model:
  type: MetNet
  input_channels: 1
  output_channels: 512
  hidden_dim: 1024
  forecast_steps: 96
  input_size: 64
  num_layers: 1
  num_att_layers: 2
  num_att_heads: 16
  low_mem: true

criterion:
  type: MetNetLoss
  loss_type: cross_entropy

runner:
  type: MetNetTrainer
  batch_size: 1
  num_workers: 4
  max_epochs: 2
  val_interval: 1
  enable_amp: true
  forecast_steps_train: 4
  forecast_steps_val: 4
  log_interval: 5
  find_unused_parameters: false
  resume: false
  pretrained_weight_path: null
  optimizer:
    type: AdamW
    lr: 0.0001
    weight_decay: 0.01
    params: {}

# 使用真实 NIMROD 数据时，替换 dataset 为：
# dataset:
#   type: NimrodDataset
#   path: /path/to/data.jsonl
#   seq_len: 16
#   forecast_steps: 96
#   input_size: 256
#   num_bins: 512
#   bin_size: 0.2
#   train:
#     path: /path/to/train.jsonl
#   val:
#     path: /path/to/val.jsonl
